
plugins {
    id 'java'
    id 'application'
    id 'jacoco'  // Code coverage
    id 'com.gradleup.shadow' version '9.4.1' // Fat JAR (successor to johnrengelman.shadow)
    id 'com.github.spotbugs' version '6.0.7' // B9: Static analysis
}

application {
    mainClass = 'javi.Javi'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Cross-compilation: compile Java 21 bytecode.
// Uses -source/-target (not --release) to allow building on any JDK >= 21.
// Note: --release provides stronger API checking but requires JDK 21 installed
// or a toolchain resolver configured. If you have JDK 21 available, uncomment
// the toolchain block in settings.gradle for strictest validation.
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

jacoco {
    // Use Gradle's default JaCoCo version for compatibility
}

import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.Confidence

// B9: SpotBugs configuration
spotbugs {
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('MEDIUM')
    ignoreFailures = true  // Don't fail build, just report
}

// B9: Configure SpotBugs to generate HTML reports
spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = file("${layout.buildDirectory.get()}/reports/spotbugs/main.html")
        }
        xml {
            required = false
        }
    }
}

repositories {
    mavenCentral()
}

// Configuration for standalone JaCoCo agent (PSTest, IntArrayTest)
configurations {
    jacocoManualAgent
    jacocoCli
    rxtxLib   // RXTX dependency for plugin JAR only
}

dependencies {
    // Primary dependencies from Maven Central for reproducible builds
    // Note: local JARs in lib/ are kept as fallback but not included in classpath
    // to avoid duplicate class issues
    
    // JavaScript engine for scripting support
    implementation 'org.mozilla:rhino:1.7.14'
    
    // Character encoding detection
    implementation 'com.github.albfernandez:juniversalchardet:2.4.0'

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.assertj:assertj-swing-junit:3.17.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // JaCoCo agent for coverage
    jacocoManualAgent 'org.jacoco:org.jacoco.agent:0.8.13:runtime'
    // JaCoCo CLI for dump/merge operations
    jacocoCli 'org.jacoco:org.jacoco.cli:0.8.13'

    // F36: RXTX serial library — plugin only, not on main classpath
    //rxtxLib 'org.rxtx:rxtx:2.1.7'
    implementation 'org.rxtx:rxtx:2.1.7'
}

// F36: Resolve rxtx dependency via Maven Central with Spring repo fallback
repositories {
    maven {
        url = uri('https://repo.spring.io/plugins-release/')
        content {
            includeGroup 'org.rxtx'
        }
    }
}

tasks.register('typingTutorJar', Jar) {
    archiveBaseName = 'javi-typingtutor'
    archiveVersion = ''
    from sourceSets.typingTutorPlugin.output
    manifest {
        attributes 'Plugin-Class': 'javi.typingtutor.TypingTutorPlugin'
    }
    destinationDirectory = file("${layout.buildDirectory.get()}/plugins")
    dependsOn 'compileTypingTutorPluginJava'
}

tasks.register('aiJar', Jar) {
    archiveBaseName = 'javi-ai'
    archiveVersion = ''
    from sourceSets.aiPlugin.output
    manifest {
        attributes 'Plugin-Class': 'javi.ai.AiPlugin'
    }
    destinationDirectory = file("${layout.buildDirectory.get()}/plugins")
    dependsOn 'compileAiPluginJava'
}

tasks.register('gitJar', Jar) {
    archiveBaseName = 'javi-git'
    archiveVersion = ''
    from sourceSets.gitPlugin.output
    manifest {
        attributes 'Plugin-Class': 'javi.git.AiPlugin'
    }
    destinationDirectory = file("${layout.buildDirectory.get()}/plugins")
    dependsOn 'compileGitPluginJava'
}

tasks.register('rxtxJar', Jar) {
    archiveBaseName = 'javi-rxtx'
    archiveVersion = ''
    from sourceSets.rxtxPlugin.output
    from {
        configurations.rxtxLib.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
      attributes 'Plugin-Class': 'javi.rxtx.RxtxPlugin'
    }
    destinationDirectory = file("${layout.buildDirectory.get()}/plugins")
    dependsOn 'compileRxtxPluginJava'
}

tasks.register('serverJar', Jar) {
    archiveBaseName = 'javi-server'
    archiveVersion = ''
    from sourceSets.serverPlugin.output
    manifest {
      attributes 'Plugin-Class': 'javi.server.ServerPlugin'
    }
    destinationDirectory = file("${layout.buildDirectory.get()}/plugins")
    dependsOn 'compileServerPluginJava'
}

tasks.register('findBugsJar', Jar) {
    archiveBaseName = 'javi-findbugs'
    archiveVersion = ''
    from sourceSets.findBugsPlugin.output
    manifest {
      attributes 'Plugin-Class': 'javi.findbugs.FindBugsPlugin'
    }
    destinationDirectory = file("${layout.buildDirectory.get()}/plugins")
    dependsOn 'compileFindBugsPluginJava'
}

sourceSets {
    // Define the main source set
    main {
        java {
            srcDirs = ['src/main/java', 'src/history/java']
        }
    }
    // F8: AI plugin sources — compiled separately for plugin JAR,
    // but included in test classpath so AI unit tests can run
    aiPlugin {
        java {
            srcDirs = ['plugins/ai/src']
        }
        resources {
            srcDirs = ['plugins/ai/src/resources']
        }
        compileClasspath += main.output + main.compileClasspath
    }
    gitPlugin {
        java {
            srcDirs = ['plugins/git/src']
        }
        resources {
            srcDirs = ['plugins/git/src/resources']
        }
        compileClasspath += main.output + main.compileClasspath
    }
    rxtxPlugin {
        java {
            srcDirs = ['plugins/rxtx/src']
        }
        resources {
            srcDirs = ['plugins/rxtx/src/resources']
        }
        compileClasspath += main.output + main.compileClasspath
    }
    serverPlugin {
        java {
            srcDirs = ['plugins/server/src']
        }
        resources {
            srcDirs = ['plugins/server/src/resources']
        }
        compileClasspath += main.output + main.compileClasspath
    }
    findBugsPlugin {
        java {
            srcDirs = ['plugins/findbugs/src']
        }
        resources {
            srcDirs = ['plugins/findbugs/src/resources']
        }
        compileClasspath += main.output + main.compileClasspath
    }
    typingTutorPlugin {
        java {
            srcDirs = ['plugins/typingtutor/src']
        }
        resources {
            srcDirs = ['plugins/typingtutor/src/resources']
        }
        compileClasspath += main.output + main.compileClasspath
     }
     test {
        java {
            // Include plugin sources so Server tests can compile
            srcDirs += ['plugins/Server/src']
        }
        compileClasspath += aiPlugin.output
        runtimeClasspath += aiPlugin.output
    }
}

tasks.named('compileJava') {
    options.compilerArgs += [
        '-Xlint:all',           // All standard warnings
        '-Xlint:-serial',       // Ignore serialVersionUID (too noisy for existing code)
        '-Xlint:-processing',   // Ignore annotation processing warnings
        '-Xlint:-rawtypes',     // Ignore raw type warnings (existing code uses many)
        '-Xlint:-static',       // Ignore static access via instance
        '-Xlint:-cast',         // Ignore redundant cast warnings
        '-Xlint:-dangling-doc-comments', // Ignore dangling javadoc comments
        '-Xlint:-this-escape',  // Ignore this-escape in constructors (existing pattern)
        '-Xmaxwarns', '500',    // Limit warning output
        '-Werror'               // Treat warnings as errors
    ]
    options.deprecation = true
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    dependsOn 'plugins'
    useJUnitPlatform {
        // T3: Exclude GUI tests — they need AwtInterface (conflicts with
        // StreamInterface singleton used by headless tests). Run via guiTest.
        excludeTags 'gui'
        // T1: Exclude live LSP integration tests — require external tools
        // (jdtls, clangd) not available in all environments.
        excludeTags 'lsp-live'
    }
    jacoco.enabled = true
    // T1: per-test timeout to prevent hangs during CI
    systemProperty 'junit.jupiter.execution.timeout.default', '30s'
    // T1: verbose test logging to identify slow/hanging tests
    testLogging {
        events 'started', 'passed', 'failed', 'skipped'
        showStandardStreams = false
        exceptionFormat = 'short'
    }
    // T1: Don't embed per-test stdout/stderr in XML results.
    // LSP tests generate GBs of JSON-RPC traffic that inflates XML files.
    reports.junitXml.outputPerTestCase = false
}

// T3: Separate test task for AssertJ Swing GUI tests (own JVM, needs display)
//
// CI integration with Xvfb (virtual framebuffer):
//   Xvfb :99 -screen 0 1024x768x24 &
//   export DISPLAY=:99
//   ./gradlew guiTest
//   kill %1   # stop Xvfb
//
// On macOS with a desktop session, just run:
//   ./gradlew guiTest
tasks.register('guiTest', Test) {
    useJUnitPlatform {
        includeTags 'gui'
    }
    // Explicitly wire test source set outputs — needed for tasks.register
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    jacoco.enabled = true
    group = 'verification'
    description = 'Run AssertJ Swing GUI tests (requires graphical display)'
    systemProperty 'junit.jupiter.execution.timeout.default', '60s'
    // JDK 24: AssertJ Swing 3.17.1 needs reflective access to java.util internals
    // (ProtectingTimerTask accesses TimerTask.state via reflection)
    jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    testLogging {
        events 'started', 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// T1: Separate test task for lsp-live integration tests (need external tools)
//
// These tests require jdtls and/or clangd to be installed and on PATH.
// Run via: ./gradlew lspLiveTest
tasks.register('lspLiveTest', Test) {
    useJUnitPlatform {
        includeTags 'lsp-live'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    group = 'verification'
    description = 'Run live LSP integration tests (requires jdtls/clangd)'
    systemProperty 'junit.jupiter.execution.timeout.default', '60s'
    testLogging {
        events 'started', 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// T1/T3: JaCoCo coverage report — merges JUnit + legacy test exec data
tasks.named('jacocoTestReport') {
    dependsOn test
    // Include coverage data from legacy PSTest/IntArrayTest runs if available
    executionData.from(
        fileTree(dir: "${layout.buildDirectory.get()}/jacoco")
            .include('*.exec')
    )
    reports {
        html.required = true
        xml.required = true
    }
}

// T1/T3: JaCoCo minimum threshold enforcement
tasks.named('jacocoTestCoverageVerification') {
    dependsOn jacocoTestReport
    executionData.from(
        fileTree(dir: "${layout.buildDirectory.get()}/jacoco")
            .include('*.exec')
    )
    violationRules {
        rule {
            // Overall project minimum
            limit {
                minimum = 0.50
            }
        }
        rule {
            // javi package — core editor logic
            element = 'PACKAGE'
            includes = ['javi']
            limit {
                minimum = 0.50
            }
        }
        rule {
            // javi.awt package — AWT UI layer
            element = 'PACKAGE'
            includes = ['javi.awt']
            limit {
                minimum = 0.30
            }
        }
        rule {
            // history package — strong coverage, hold the line
            element = 'PACKAGE'
            includes = ['history']
            limit {
                minimum = 0.78
            }
        }
    }
}

// Ensure history classes are included in the JAR
// I3: Version from project property or git describe
def projectVersion = project.findProperty('version') ?: 'dev'

// F29: Capture git describe for JAR manifest (ext for plugin access)
ext.gitDescribe = providers.exec {
    commandLine 'git', 'describe', '--always', '--dirty'
}.standardOutput.asText.map { it.trim() }.getOrElse('unknown')

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'javi',
            'Implementation-Version': projectVersion,
            'Build-Date': new Date().format('yyyy-MM-dd HH:mm:ss'),
            'Main-Class': 'javi.Javi',
            'Class-Path': configurations.runtimeClasspath.files.collect { it.getName() }.join(' '),
            'Git-Describe': gitDescribe
        )
    }
    archiveBaseName.set('javi')
    archiveVersion.set(projectVersion)
    destinationDirectory.set(layout.buildDirectory.dir("lib"))
}

// I3: Copy JAR to dist directory with optional versioning
tasks.register('dist', Copy) {
    dependsOn jar
    from jar.archiveFile
    into "$projectDir/dist"
    // Use versioned name if version provided, otherwise javi.jar
    rename { projectVersion == 'dev' ? 'javi.jar' : "javi-${projectVersion}.jar" }
}

// I3: Copy fat JAR to dist directory with optional versioning
tasks.register('distFat', Copy) {
    dependsOn shadowJar
    from shadowJar.archiveFile
    into "$projectDir/dist"
    rename { projectVersion == 'dev' ? 'javi-all.jar' : "javi-all-${projectVersion}.jar" }
}

// Run PSTest with JaCoCo coverage
tasks.register('pstestCoverage', JavaExec) {
    dependsOn compileJava
    group = 'verification'
    description = 'Run PSTest with code coverage'
    
    mainClass = 'history.PSTest'
    classpath = sourceSets.main.runtimeClasspath
    
    def execFile = file("${layout.buildDirectory.get()}/jacoco/pstest.exec")
    doFirst {
        execFile.parentFile.mkdirs()
        def agentJar = configurations.jacocoManualAgent.singleFile
        jvmArgs "-javaagent:${agentJar}=destfile=${execFile}"
    }
}

// Run IntArrayTest with JaCoCo coverage
tasks.register('intArrayTestCoverage', JavaExec) {
    dependsOn compileJava
    group = 'verification'
    description = 'Run IntArrayTest with code coverage'
    
    mainClass = 'history.IntArrayTest'
    classpath = sourceSets.main.runtimeClasspath
    
    def execFile = file("${layout.buildDirectory.get()}/jacoco/intarraytest.exec")
    doFirst {
        execFile.parentFile.mkdirs()
        def agentJar = configurations.jacocoManualAgent.singleFile
        jvmArgs "-javaagent:${agentJar}=destfile=${execFile}", '-ea'
    }
}

// T3: Print the JaCoCo agent JAR path for use by Makefile/shell scripts
tasks.register('jacocoAgentPath') {
    group = 'verification'
    description = 'Print the JaCoCo agent JAR path'
    doLast {
        println configurations.jacocoManualAgent.singleFile.absolutePath
    }
}

// T3: Dump coverage from a running JaCoCo tcpserver agent
tasks.register('jacocoDump', JavaExec) {
    group = 'verification'
    description = 'Dump coverage from running javi (JaCoCo tcpserver on port 6300)'
    mainClass = 'org.jacoco.cli.internal.Main'
    classpath = configurations.jacocoCli
    def destFile = file("${layout.buildDirectory.get()}/jacoco/gui.exec")
    args = ['dump', '--address', 'localhost', '--port', '6300',
            '--destfile', destFile.absolutePath, '--reset']
    doFirst {
        destFile.parentFile.mkdirs()
    }
}

// T3: Merge all .exec files into one merged.exec
tasks.register('jacocoMerge', JavaExec) {
    group = 'verification'
    description = 'Merge all JaCoCo .exec files into merged.exec'
    mainClass = 'org.jacoco.cli.internal.Main'
    classpath = configurations.jacocoCli
    def jacocoDir = file("${layout.buildDirectory.get()}/jacoco")
    def destFile = file("${jacocoDir}/merged.exec")
    doFirst {
        def execFiles = fileTree(jacocoDir).include('*.exec')
            .findAll { it.name != 'merged.exec' }
        if (execFiles.isEmpty()) {
            throw new GradleException('No .exec files found in build/jacoco/')
        }
        // Build args: merge --destfile merged.exec file1.exec file2.exec ...
        def mergeArgs = ['merge', '--destfile', destFile.absolutePath]
        execFiles.each { mergeArgs.add(it.absolutePath) }
        args = mergeArgs
    }
}

// T3: Generate merged coverage report from all .exec files
// Usage: ./gradlew mergedCoverageReport
// Produces: build/reports/jacoco/merged/html/index.html
tasks.register('mergedCoverageReport', JacocoReport) {
    dependsOn compileJava, test
    mustRunAfter 'guiTest', 'pstestCoverage', 'intArrayTestCoverage'
    group = 'verification'
    description = 'Generate merged coverage report from all .exec files'
    executionData.from(
        fileTree(dir: "${layout.buildDirectory.get()}/jacoco")
            .include('*.exec')
    )
    sourceDirectories.from(files('src/main/java', 'src/history/java'))
    classDirectories.from(files("${layout.buildDirectory.get()}/classes/java/main"))
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.dir('reports/jacoco/merged/html')
        }
        xml {
            required = true
            outputLocation = layout.buildDirectory.file('reports/jacoco/merged/merged.xml')
        }
    }
}

// =============================================================================
// F29: Plugin Build Architecture
// =============================================================================

// Discover plugin directories under plugins/
def pluginsDir = file("$projectDir/plugins")

tasks.register('plugins') {
    dependsOn compileJava, 'typingTutorJar', 'aiJar', 'gitJar', 'rxtxJar', 'serverJar', 'findBugsJar',  jar
}

tasks.named('build') {
    dependsOn 'plugins'
}

tasks.register('distAll', Copy) {
    dependsOn jar, 'plugins'
    from(jar.archiveFile)
    from(layout.buildDirectory.dir("plugins")) {
        include 'javi-*.jar'
        exclude jar.archiveFileName.get()
    }
    into "$projectDir/dist"
    // Rename main JAR to javi.jar (consistent with dist task)
    rename(jar.archiveFileName.get(), projectVersion == 'dev' ? 'javi.jar' : "javi-${projectVersion}.jar")
}
tasks.register('copyTestDeps', Copy) {
    from configurations.testCompileClasspath
    into "$projectDir/lib/test"
}
